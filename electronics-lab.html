<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOLT//WERK — Electronics Knowledge Library</title>
<style>
:root{--red:#e63b2e;--yel:#f2c230;--blu:#1f5fbf;--grn:#3fbf6f}
[data-theme=dark]{--bg:#111214;--panel:#1b1c1f;--panel2:#25272b;--ink:#ecebe6;--mute:#8d8f94;--line:#3a3c41;--grid:rgba(255,255,255,.03)}
[data-theme=light]{--bg:#ece6d8;--panel:#fbf8f1;--panel2:#e3dccb;--ink:#141414;--mute:#5d5b55;--line:#141414;--grid:rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Futura","Century Gothic","Trebuchet MS",sans-serif;background:var(--bg);color:var(--ink);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;transition:background .3s,color .3s}
h1,h2,h3{text-transform:uppercase;letter-spacing:.08em}
a{color:var(--yel)}
.hazard{background:repeating-linear-gradient(45deg,var(--yel) 0 14px,#111 14px 28px)}
/* INTRO */
#intro{position:fixed;inset:0;z-index:99;background:#0d0d0e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{color:#ecebe6;font-size:clamp(22px,4vw,40px)}#intro h1 span{color:var(--red)}
.g1{animation:spin 6s linear infinite}.g2{animation:spin 4s linear infinite reverse}.g3{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gear{transform-box:fill-box;transform-origin:center}
.bar{width:min(420px,80vw);height:26px;border:3px solid #ecebe6;background:#111}
.bar div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--yel) 0 14px,#111 14px 28px);background-size:40px 40px;animation:fill 2.6s cubic-bezier(.6,.1,.3,1) forwards,move .6s linear infinite}
@keyframes fill{to{width:100%}}@keyframes move{to{background-position:40px 0}}
#pct{color:#8d8f94;font-family:monospace;letter-spacing:.2em}
/* LAYOUT */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:4px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;gap:4px}.logo i{width:18px;height:18px;display:block}
.logo i:nth-child(1){background:var(--red);border-radius:50%}.logo i:nth-child(2){background:var(--yel)}
.logo i:nth-child(3){width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid var(--blu)}
header h1{font-size:18px;flex:1}
button,select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);padding:7px 12px;cursor:pointer}
button:hover{background:var(--yel);color:#111}
#menuBtn{display:none}
.wrap{display:flex;min-height:calc(100vh - 62px)}
nav{width:250px;background:var(--panel);border-right:4px solid var(--line);padding:14px 0;overflow:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
nav h4{font-size:11px;color:var(--mute);letter-spacing:.2em;padding:12px 18px 6px;text-transform:uppercase}
nav a{display:flex;gap:10px;align-items:center;padding:8px 18px;color:var(--ink);text-decoration:none;border-left:5px solid transparent;font-size:14px}
nav a:hover{background:var(--panel2)}nav a.on{border-left-color:var(--red);background:var(--panel2)}
main{flex:1;padding:26px;max-width:1150px}
/* HOME */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border:3px solid var(--line);background:var(--panel);padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero h2{font-size:clamp(22px,3.5vw,38px);line-height:1.05}.hero h2 b{color:var(--red)}
.hero p{color:var(--mute);margin-top:8px;max-width:560px}
.hero .shapes{display:flex;gap:8px}.hero .shapes i{width:46px;height:46px;display:block}
#search{width:100%;padding:12px 14px;font-size:16px;margin-bottom:12px;cursor:text}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chips button{font-size:12px;padding:5px 10px;text-transform:uppercase}.chips button.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:3px solid var(--line);padding:16px;cursor:pointer;position:relative;transition:transform .15s}
.card:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--red)}
.card .ic{font-size:26px}.card h3{font-size:14px;margin:8px 0 6px}.card p{font-size:13px;color:var(--mute)}
.card .tag{position:absolute;top:0;right:0;font-size:10px;padding:3px 7px;color:#111;text-transform:uppercase;letter-spacing:.1em}
/* TOPIC */
.topbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.thead{border-left:10px solid var(--red);padding-left:14px;margin-bottom:16px}
.thead small{color:var(--mute);letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.thead p{color:var(--mute);margin-top:6px;max-width:760px}
.lab{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.box{background:var(--panel);border:3px solid var(--line);padding:16px;position:relative}
.box>h3{font-size:12px;color:var(--mute);margin-bottom:12px;letter-spacing:.2em}
.box.stage{min-height:300px}
svg text{font-family:monospace;fill:var(--ink)}
.wire{stroke:var(--ink);stroke-width:3;fill:none}
.flow{stroke:var(--yel);stroke-width:4;fill:none;stroke-dasharray:3 15;animation:flow 1s linear infinite;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-36}}
[data-info]{cursor:help}text[data-info]{text-decoration:underline dashed}
.sl{display:block;margin:10px 0;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.sl b{color:var(--yel);font-family:monospace;font-size:15px}
[data-theme=light] .sl b{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--red);margin-top:4px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.readout div{background:var(--panel2);padding:10px;border-left:4px solid var(--blu)}
.readout small{display:block;font-size:10px;color:var(--mute);letter-spacing:.15em}
.readout span{font-family:monospace;font-size:18px}
.infos{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.infos button{font-size:12px;border-color:var(--blu)}
.reason{margin-top:16px;background:var(--panel);border:3px dashed var(--line);padding:14px 16px;font-size:14px;line-height:1.6}
.reason b{color:var(--red)}
canvas{width:100%;background:var(--panel2);display:block}
.lamp{width:70px;height:70px;border-radius:50%;border:4px solid var(--line);margin:10px auto;transition:.15s}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btnrow button.on{background:var(--red);color:#fff}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.links a{display:block;text-decoration:none;color:var(--ink)}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modal .win{background:var(--panel);border:4px solid var(--line);max-width:480px;width:100%;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modal .wt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--blu);color:#fff;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
#modal .wt button{background:var(--red);color:#fff;border:none;padding:2px 10px}
#modal .wb{padding:18px;line-height:1.6;font-size:15px}
#modal .stripe{height:10px}
@media(max-width:860px){nav{position:fixed;left:-260px;z-index:20;transition:left .25s}nav.open{left:0}#menuBtn{display:block}.lab{grid-template-columns:1fr}.hero{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="intro">
 <svg width="260" height="190" viewBox="0 0 200 150" id="gears"></svg>
 <h1>VOLT<span>//</span>WERK</h1>
 <div class="bar"><div></div></div>
 <div id="pct">LOADING CIRCUITS 0%</div>
</div>

<header>
 <button id="menuBtn" aria-label="menu">☰</button>
 <div class="logo"><i></i><i></i><i></i></div>
 <h1>VOLT//WERK <small style="color:var(--mute);font-size:11px">Electronics Library</small></h1>
 <button id="homeBtn">⌂ Home</button>
 <button id="themeBtn">◐ Theme</button>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>

<div id="modal"><div class="win"><div class="wt"><span id="mt"></span><button id="mx">✕</button></div><div class="wb" id="mb"></div><div class="stripe hazard"></div></div></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
let timers=[],rafId=0;
function clearSims(){timers.forEach(clearInterval);timers=[];cancelAnimationFrame(rafId)}
const fmt=(v,u)=>{const a=Math.abs(v);const p=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];for(const[m,s]of p)if(a>=m)return(v/m).toFixed(2).replace(/\.?0+$/,'')+' '+s+u;return v.toExponential(1)+' '+u};
const sl=(id,label,min,max,step,val,unit)=>`<label class="sl">${label}: <b id="${id}v">${val}</b> ${unit}<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
const ro=items=>`<div class="readout">${items.map(([id,l])=>`<div><small>${l}</small><span id="${id}">–</span></div>`).join('')}</div>`;
const val=id=>+$('#'+id).value;
function bind(ids,fn){ids.forEach(id=>{const e=$('#'+id);e.addEventListener('input',()=>{const v=$('#'+id+'v');if(v)v.textContent=e.value;fn()})});fn()}
function setFlow(I){const f=document.querySelectorAll('.flow');f.forEach(p=>{if(I<=1e-6){p.style.animationPlayState='paused';p.style.opacity=.2}else{p.style.animationPlayState='running';p.style.opacity=1;p.style.animationDuration=Math.max(.15,Math.min(4,.04/I))+'s'}})}
function popup(t,b){$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.add('show')}
$('#mx').onclick=()=>$('#modal').classList.remove('show');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};

/* generic loop schematic: battery left, component(s) right */
function loop(compSVG,srcLabel='V',extra=''){return `<svg viewBox="0 0 400 240" width="100%">
 <path class="wire" d="M60 40 H340 V200 H60 Z"/><path class="flow" d="M60 120 V40 H340 V200 H60 Z"/>
 <g data-info="source"><rect x="40" y="100" width="40" height="40" fill="var(--panel)"/>
 <line x1="42" y1="112" x2="78" y2="112" stroke="var(--red)" stroke-width="4"/><line x1="50" y1="126" x2="70" y2="126" stroke="var(--ink)" stroke-width="4"/>
 <text x="2" y="125" data-info="source">${srcLabel}</text><text x="84" y="110" font-size="12">+</text></g>
 ${compSVG}${extra}</svg>`}
const resV=(x,y,l,key='resistor')=>`<g data-info="${key}"><rect x="${x-14}" y="${y-35}" width="28" height="70" fill="var(--panel)" stroke="var(--yel)" stroke-width="3"/><text x="${x+22}" y="${y+5}" data-info="${key}">${l}</text></g>`;

/* ---------- INFO GLOSSARY (popup text) ---------- */
const INFO={
source:['Voltage Source','A battery or power supply creates an electric <b>potential difference</b> (voltage). Think of it as a pump pushing charge around the loop. The long line is the + terminal.'],
resistor:['Resistor','A resistor <b>limits current</b>. Measured in ohms (Ω). It turns electrical energy into heat: P = I²·R.'],
current:['Current (I)','The flow rate of charge, measured in amperes (A). 1 A = 1 coulomb per second. The moving yellow dots show it: faster dots mean more current.'],
voltage:['Voltage (V)','The "pressure" that pushes charge, measured in volts. It is always measured <b>between two points</b>.'],
power:['Power (P)','The energy used per second: P = V·I, in watts. Too much power burns a component, so check its rating.'],
series:['Series','Components are connected one after another. The <b>same current</b> flows through each, and the resistances add up: R = R1 + R2.'],
parallel:['Parallel','Components share both nodes. The <b>same voltage</b> is across each, the currents add up, and 1/R = 1/R1 + 1/R2. The total is always smaller than the smallest resistor.'],
divider:['Voltage divider','Two series resistors split the voltage in proportion to their values: Vout = Vin·R2/(R1+R2). Used for sensors, reference levels and ADC inputs.'],
capacitor:['Capacitor','Stores energy in an <b>electric field</b> between two plates. Measured in farads. Its voltage cannot change instantly.'],
tau:['Time constant τ','τ = R·C (or L/R). After 1τ the curve is at 63%; after 5τ it is considered complete (99%).'],
inductor:['Inductor','A coil that stores energy in a <b>magnetic field</b>. It resists <b>changes</b> in current, so its current cannot jump instantly.'],
diode:['Diode','A one-way valve for current. It conducts when forward-biased above about 0.6–0.7 V (silicon) and blocks reverse current.'],
vf:['Forward voltage Vf','The voltage drop across a conducting diode or LED. Red LED ≈ 1.8 V, green ≈ 2.1 V, blue/white ≈ 3.0 V.'],
led:['LED','A Light Emitting Diode. It <b>always needs a current-limiting resistor</b>: R = (Vs − Vf)/I.'],
bjt:['BJT transistor','A small base current controls a large collector current: Ic = β·Ib. Regions: <b>cutoff</b> (off), <b>active</b> (amplifier), <b>saturation</b> (fully on switch).'],
beta:['β (hFE)','The current gain of a bipolar transistor, typically 50–300.'],
gate:['Logic gate','A circuit whose output is a Boolean function of its inputs (1 = HIGH, 0 = LOW). Every computer is built from these.'],
ac:['Alternating current','The voltage changes direction periodically, usually as a sine wave: v(t) = Vp·sin(2πft).'],
rms:['RMS value','The equivalent DC value that delivers the same power: Vrms = Vp/√2 ≈ 0.707·Vp. Mains in France: 230 V RMS ≈ 325 V peak.'],
freq:['Frequency','Cycles per second, in hertz (Hz). Period T = 1/f. European mains run at 50 Hz.'],
t555:['555 timer','A classic chip that can work as an oscillator (astable), a one-shot (monostable) or a flip-flop. Here: astable mode, so the LED blinks on its own.'],
duty:['Duty cycle','The fraction of the period that the output is HIGH: D = (R1+R2)/(R1+2R2).'],
color:['Color code','Bands: 1st digit, 2nd digit, multiplier, tolerance. Mnemonic: Black Brown Red Orange Yellow Green Blue Violet Grey White = 0–9.'],
reactance:['Reactance','The AC "resistance" of capacitors and inductors. Xc = 1/(2πfC) falls with frequency; XL = 2πfL rises with frequency.']
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-info]');if(t&&INFO[t.dataset.info]){const[a,b]=INFO[t.dataset.info];popup(a,b)}});
const chips=keys=>`<div class="infos">${keys.map(k=>`<button data-info="${k}">ⓘ ${INFO[k][0]}</button>`).join('')}</div>`;

/* ---------- plotting ---------- */
function plot(cv,fn,xmax,ymax,opts={}){const c=cv.getContext('2d'),W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;c.clearRect(0,0,W,H);
 const css=getComputedStyle(document.body),ink=css.getPropertyValue('--mute');c.strokeStyle=ink;c.lineWidth=1;c.globalAlpha=.4;
 for(let i=1;i<10;i++){c.beginPath();c.moveTo(W*i/10,0);c.lineTo(W*i/10,H);c.moveTo(0,H*i/10);c.lineTo(W,H*i/10);c.stroke()}c.globalAlpha=1;
 c.strokeStyle=opts.color||'#f2c230';c.lineWidth=4;c.beginPath();const lim=opts.until??xmax;
 for(let px=0;px<=W;px++){const x=px/W*xmax;if(x>lim)break;const y=fn(x);const py=H-(y/ymax)*H*(opts.half?.5:1)-(opts.half?H/2:0);px?c.lineTo(px,py):c.moveTo(px,py)}c.stroke();
 if(opts.mark){const[x,y]=opts.mark;c.fillStyle='#e63b2e';c.beginPath();c.arc(x/xmax*W,H-y/ymax*H,10,0,7);c.fill()}
 if(opts.label){c.fillStyle=ink;c.font='22px monospace';c.fillText(opts.label,12,28)}}

/* ---------- TOPICS ---------- */
const TOPICS=[
{id:'ohm',cat:'Fundamentals',ic:'Ω',t:"Ohm's Law",s:'V = I × R: the relationship behind every circuit.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Live schematic</h3>${loop(resV(340,120,'R'),'V')}</div>
 <div class="box"><h3>Controls</h3>${sl('v','Voltage',1,24,1,9,'V')}${sl('r','Resistance',10,1000,10,220,'Ω')}${ro([['oi','Current I'],['op','Power P']])}${chips(['voltage','current','resistor','power'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> Picture water in a pipe. Voltage is the pressure, current is the flow and resistance is how narrow the pipe is. More pressure gives more flow; a narrower pipe gives less flow. So <b>I = V / R</b>.</div>`,
 init(){bind(['v','r'],()=>{const I=val('v')/val('r');$('#oi').textContent=fmt(I,'A');$('#op').textContent=fmt(I*val('v'),'W');setFlow(I)})}},

{id:'serpar',cat:'Fundamentals',ic:'⫴',t:'Series & Parallel',s:'How resistors combine.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Schematic</h3><div id="sp"></div></div>
 <div class="box"><h3>Controls</h3><div class="btnrow"><button id="mS" class="on">Series</button><button id="mP">Parallel</button></div>
 ${sl('v','Voltage',1,24,1,12,'V')}${sl('r1','R1',10,1000,10,100,'Ω')}${sl('r2','R2',10,1000,10,300,'Ω')}${ro([['req','R total'],['it','Total I']])}${chips(['series','parallel'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> In <b>series</b>, current has to pass through both resistors, like two narrow sections in one pipe, so resistance adds up. In <b>parallel</b>, current has two paths to choose from, so the total resistance drops.</div>`,
 init(){let par=false;const draw=()=>{$('#sp').innerHTML=par?loop(resV(270,120,'R1','parallel')+resV(340,120,'R2','parallel'),'V','<path class="wire" d="M270 40V85M270 155V200"/><path class="flow" d="M270 40V200"/>'):loop(`<g data-info="series">`+resV(340,80,'R1')+resV(340,160,'R2')+`</g>`,'V')};
 const up=()=>{const a=val('r1'),b=val('r2'),R=par?a*b/(a+b):a+b;$('#req').textContent=fmt(R,'Ω');$('#it').textContent=fmt(val('v')/R,'A');setFlow(val('v')/R)};
 $('#mS').onclick=()=>{par=false;$('#mS').classList.add('on');$('#mP').classList.remove('on');draw();up()};$('#mP').onclick=()=>{par=true;$('#mP').classList.add('on');$('#mS').classList.remove('on');draw();up()};draw();bind(['v','r1','r2'],up)}},

{id:'divider',cat:'Fundamentals',ic:'÷',t:'Voltage Divider',s:'Split a voltage with two resistors.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Schematic</h3>${loop(resV(340,80,'R1')+resV(340,160,'R2')+'<line x1="340" y1="120" x2="390" y2="120" stroke="var(--red)" stroke-width="3"/><circle cx="390" cy="120" r="5" fill="var(--red)"/><text x="350" y="112" data-info="divider">Vout</text>','Vin')}
 <div style="height:22px;background:var(--panel2);margin-top:8px"><div id="bar" class="hazard" style="height:100%;width:50%"></div></div></div>
 <div class="box"><h3>Controls</h3>${sl('v','Vin',1,24,1,12,'V')}${sl('r1','R1',100,10000,100,1000,'Ω')}${sl('r2','R2',100,10000,100,1000,'Ω')}${ro([['vo','Vout'],['ra','Ratio']])}${chips(['divider','series'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> The same current flows through both resistors, so each one "takes" a share of the voltage proportional to its size. A bigger R2 gives a bigger Vout.</div>`,
 init(){bind(['v','r1','r2'],()=>{const r=val('r2')/(val('r1')+val('r2'));$('#vo').textContent=fmt(val('v')*r,'V');$('#ra').textContent=(r*100).toFixed(1)+' %';$('#bar').style.width=r*100+'%';setFlow(val('v')/(val('r1')+val('r2'))*30)})}},

{id:'cap',cat:'Passive',ic:'⊣⊢',t:'Capacitor (RC)',s:'Charging and discharging curves.',
 html:()=>rcHTML('C','µF','capacitor','The capacitor is a bucket being filled through a tap (R). At first it fills fast; as it fills up the pressure difference falls, so it fills ever more slowly. That gives the exponential curve, and τ = R·C sets the speed.'),
 init(){rcInit('C')}},
{id:'ind',cat:'Passive',ic:'∿',t:'Inductor (RL)',s:'Current growth in a coil.',
 html:()=>rcHTML('L','mH','inductor','An inductor is like a heavy flywheel: hard to start and hard to stop. Current builds up gradually, with τ = L/R, and the coil "fights" any change.'),
 init(){rcInit('L')}},

{id:'diode',cat:'Semiconductors',ic:'▷|',t:'Diode I-V Curve',s:'One-way current valve.',
 html:()=>`<div class="lab"><div class="box stage"><h3>I-V characteristic</h3><canvas id="cv" style="height:280px"></canvas></div>
 <div class="box"><h3>Controls</h3>${sl('v','Forward voltage',0,0.8,0.01,0.5,'V')}${ro([['di','Current'],['ds','State']])}${chips(['diode','vf'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> Below about 0.6 V the "door" stays shut. Past that threshold it swings open and the current rises <b>exponentially</b>, which is why diodes need a series resistor.</div>`,
 init(){const f=v=>1e-12*(Math.exp(v/0.026)-1);bind(['v'],()=>{const v=val('v'),I=Math.min(f(v),0.1);$('#di').textContent=fmt(I,'A');$('#ds').textContent=v<.55?'BLOCKING':'CONDUCTING';plot($('#cv'),x=>Math.min(f(x),.1),.8,.1,{mark:[v,I],label:'I (max 100 mA) vs V'})})}},

{id:'led',cat:'Semiconductors',ic:'💡',t:'LED & Resistor',s:'Compute the resistor that saves your LED.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Live LED</h3><div class="lamp" id="lmp" data-info="led"></div>${loop(resV(340,120,'R')+'<text x="150" y="30" data-info="led">LED →</text>','Vs')}</div>
 <div class="box"><h3>Controls</h3><select id="col"><option value="1.8,#ff3030">Red (1.8 V)</option><option value="2.1,#30ff60">Green (2.1 V)</option><option value="3.0,#4090ff">Blue (3.0 V)</option><option value="3.1,#ffffff">White (3.1 V)</option></select>
 ${sl('v','Supply',3,24,0.5,5,'V')}${sl('i','LED current',1,30,1,15,'mA')}${ro([['lr','Resistor'],['lp','R power']])}${chips(['led','vf','resistor'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> The LED "eats" Vf volts and the resistor must absorb the rest: <b>R = (Vs − Vf) / I</b>. Without it, the current rises until the LED burns out.</div>`,
 init(){const up=()=>{const[vf,c]=$('#col').value.split(','),I=val('i')/1000,R=(val('v')-vf)/I;$('#lr').textContent=R>0?fmt(R,'Ω'):'Vs too low!';$('#lp').textContent=R>0?fmt((val('v')-vf)*I,'W'):'–';const b=R>0?val('i')/30:0;$('#lmp').style.background=c;$('#lmp').style.opacity=.15+b*.85;$('#lmp').style.boxShadow=`0 0 ${b*60}px ${b*20}px ${c}`;setFlow(R>0?I:0)};$('#col').onchange=up;bind(['v','i'],up)}},

{id:'bjt',cat:'Semiconductors',ic:'⏚',t:'Transistor Switch',s:'A small current controls a big one.',
 html:()=>`<div class="lab"><div class="box stage"><h3>NPN switch</h3><svg viewBox="0 0 400 250" width="100%">
 <path class="wire" d="M250 20V80M250 160V230M60 120H200"/><path class="flow" d="M250 20V230"/>
 <circle cx="235" cy="120" r="38" fill="none" stroke="var(--blu)" stroke-width="3" data-info="bjt"/>
 <line x1="215" y1="95" x2="215" y2="145" stroke="var(--ink)" stroke-width="4"/><path class="wire" d="M215 108L250 82M215 132L250 158"/>
 <text x="270" y="125" data-info="bjt">NPN</text><text x="70" y="110" data-info="current">Ib →</text><text x="260" y="50" data-info="beta">Ic</text>
 <circle id="bl" cx="320" cy="40" r="18" fill="#ff3030" opacity=".1"/><text x="300" y="80">LOAD</text></svg></div>
 <div class="box"><h3>Controls</h3>${sl('ib','Base current',0,500,5,50,'µA')}${sl('b','β gain',50,300,10,100,'')}${ro([['ic','Collector Ic'],['st','Region']])}${chips(['bjt','beta'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> The base is a small tap that opens a big gate. A little base current lets β times more current flow through the load, until the gate is fully open (<b>saturation</b>). Supply 9 V, load 300 Ω, so Ic max is about 30 mA.</div>`,
 init(){bind(['ib','b'],()=>{const ib=val('ib')*1e-6,max=(9-.2)/300,Ic=Math.min(ib*val('b'),max);$('#ic').textContent=fmt(Ic,'A');$('#st').textContent=ib===0?'CUTOFF':Ic>=max?'SATURATION':'ACTIVE';$('#bl').setAttribute('opacity',.1+.9*Ic/max);setFlow(Ic)})}},

{id:'gates',cat:'Digital',ic:'&',t:'Logic Gates',s:'AND, OR, XOR, NAND, NOR, NOT.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Gate simulator</h3><div class="btnrow" id="gsel"></div>
 <svg viewBox="0 0 400 180" width="100%"><path class="wire" d="M20 60H150M20 120H150M250 90H330"/>
 <rect x="150" y="40" width="100" height="100" fill="var(--panel2)" stroke="var(--yel)" stroke-width="3" data-info="gate"/>
 <text id="gn" x="200" y="97" text-anchor="middle" font-size="20" data-info="gate">AND</text>
 <circle id="ga" cx="20" cy="60" r="10"/><circle id="gb" cx="20" cy="120" r="10"/><circle id="gq" cx="345" cy="90" r="18"/></svg>
 <div class="btnrow"><button id="ba">A = 0</button><button id="bb">B = 0</button></div></div>
 <div class="box"><h3>Truth table</h3><div id="tt"></div>${chips(['gate'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> AND means "both", OR means "at least one", XOR means "exactly one", NOT flips the input. NAND and NOR are AND and OR followed by NOT. NAND alone can build every other gate!</div>`,
 init(){const G={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b),NOT:a=>1-a};let g='AND',A=0,B=0;
 $('#gsel').innerHTML=Object.keys(G).map(k=>`<button data-g="${k}">${k}</button>`).join('');
 const up=()=>{const q=G[g](A,B),on='#3fbf6f',off='#555';$('#gn').textContent=g;$('#ga').setAttribute('fill',A?on:off);$('#gb').setAttribute('fill',B?on:off);$('#gq').setAttribute('fill',q?'#f2c230':off);$('#ba').textContent='A = '+A;$('#bb').textContent='B = '+B;$('#bb').disabled=g==='NOT';
 document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g===g));
 $('#tt').innerHTML='<table style="width:100%;font-family:monospace;font-size:18px;text-align:center;border-collapse:collapse">'+'<tr><th>A</th>'+(g!=='NOT'?'<th>B</th>':'')+'<th>Q</th></tr>'+[[0,0],[0,1],[1,0],[1,1]].filter(r=>g!=='NOT'||r[1]===0).map(([a,b])=>`<tr style="background:${a===A&&(g==='NOT'||b===B)?'var(--red)':'transparent'}"><td>${a}</td>${g!=='NOT'?`<td>${b}</td>`:''}<td>${G[g](a,b)}</td></tr>`).join('')+'</table>'};
 $('#gsel').onclick=e=>{if(e.target.dataset.g){g=e.target.dataset.g;up()}};$('#ba').onclick=()=>{A^=1;up()};$('#bb').onclick=()=>{B^=1;up()};up()}},

{id:'ac',cat:'Signals',ic:'〜',t:'AC Sine Wave',s:'Amplitude, frequency, RMS.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Oscilloscope</h3><canvas id="cv" style="height:280px"></canvas></div>
 <div class="box"><h3>Controls</h3>${sl('a','Peak voltage',1,325,1,325,'V')}${sl('f','Frequency',1,10,0.5,2,'Hz (slowed)')}${ro([['rm','RMS'],['pp','Peak-peak'],['pe','Period']])}${chips(['ac','rms','freq'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> AC is a tide that flows back and forth instead of one way. The RMS value is the "useful average": 230 V RMS heats a kettle exactly as well as 230 V DC would.</div>`,
 init(){bind(['a','f'],()=>{$('#rm').textContent=fmt(val('a')/Math.SQRT2,'V');$('#pp').textContent=fmt(2*val('a'),'V');$('#pe').textContent=fmt(1/val('f'),'s')});
 let t0=performance.now();const loopf=now=>{const t=(now-t0)/1000,A=val('a'),f=val('f');plot($('#cv'),x=>A*Math.sin(2*Math.PI*f*(x-t)),2,A*1.1,{half:true,label:'v(t), window 2 s'});rafId=requestAnimationFrame(loopf)};rafId=requestAnimationFrame(loopf)}},

{id:'t555',cat:'Digital',ic:'⏱',t:'555 Timer Astable',s:'The blinking-LED oscillator.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Live output</h3><div class="lamp" id="lmp" data-info="t555"></div>
 <svg viewBox="0 0 400 120" width="100%"><rect x="150" y="10" width="100" height="90" fill="var(--panel2)" stroke="var(--yel)" stroke-width="3" data-info="t555"/><text x="200" y="62" text-anchor="middle" font-size="22" data-info="t555">NE555</text>
 <path class="wire" d="M250 55H320"/><polyline id="sq" points="" fill="none" stroke="var(--red)" stroke-width="3"/></svg></div>
 <div class="box"><h3>Controls</h3>${sl('r1','R1',1,100,1,10,'kΩ')}${sl('r2','R2',1,200,1,47,'kΩ')}${sl('c','C',1,100,1,10,'µF')}${ro([['fq','Frequency'],['dt','Duty cycle'],['th','T high']])}${chips(['t555','duty','capacitor'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> The capacitor charges through R1+R2 until it reaches ⅔ Vcc, then discharges through R2 to ⅓ Vcc, over and over. <b>f = 1.44 / ((R1 + 2R2)·C)</b>.</div>`,
 init(){let tm;const up=()=>{const R1=val('r1')*1e3,R2=val('r2')*1e3,C=val('c')*1e-6,f=1.44/((R1+2*R2)*C),D=(R1+R2)/(R1+2*R2),th=.693*(R1+R2)*C,tl=.693*R2*C;
 $('#fq').textContent=fmt(f,'Hz');$('#dt').textContent=(D*100).toFixed(1)+' %';$('#th').textContent=fmt(th,'s');
 let p='',x=0;const w=70/ (1/f>0?1:1);for(let k=0;k<3;k++){p+=`${x},20 ${x+w*D},20 ${x+w*D},90 ${x+w},90 `;x+=w}
 $('#sq').setAttribute('points',p.split(' ').filter(Boolean).map(s=>{const[a,b]=s.split(',');return(+a/3+325)+','+b}).join(' '));
 clearTimeout(tm);const blink=on=>{$('#lmp')&&($('#lmp').style.background=on?'#ff3030':'#333',$('#lmp').style.boxShadow=on?'0 0 40px 10px #ff3030':'none');tm=setTimeout(()=>blink(!on),Math.max(30,(on?th:tl)*1000))};blink(true);timers.push(setInterval(()=>{if(!$('#lmp'))clearTimeout(tm)},500))};bind(['r1','r2','c'],up)}},

{id:'color',cat:'Tools',ic:'▤',t:'Resistor Color Code',s:'Decode colored bands into ohms.',
 html:()=>{const C=['black','brown','red','orange','yellow','green','blue','violet','grey','white'];const o=C.map((c,i)=>`<option value="${i}">${c}</option>`).join('');
 return `<div class="lab"><div class="box stage"><h3>Resistor</h3><svg viewBox="0 0 400 140" width="100%" data-info="color"><line x1="10" y1="70" x2="390" y2="70" stroke="#999" stroke-width="5"/>
 <rect x="100" y="35" width="200" height="70" rx="30" fill="#d8c08a"/>${[140,175,210,260].map((x,i)=>`<rect id="bd${i}" x="${x}" y="35" width="16" height="70"/>`).join('')}</svg>
 <div style="font-size:34px;text-align:center;font-family:monospace" id="cval"></div></div>
 <div class="box"><h3>Bands</h3><label class="sl">1st digit <select id="c0">${o}</select></label><label class="sl">2nd digit <select id="c1">${o}</select></label>
 <label class="sl">Multiplier <select id="c2">${o}<option value="-1">gold</option><option value="-2">silver</option></select></label>
 <label class="sl">Tolerance <select id="c3"><option value="5">gold ±5%</option><option value="10">silver ±10%</option><option value="1">brown ±1%</option><option value="2">red ±2%</option></select></label>${chips(['color','resistor'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> Read from the side opposite the gold or silver band. Two digits, then the multiplier is the number of zeros: brown-black-red = 1, 0, ×100 = 1 kΩ.</div>`},
 init(){const C=['#111','#7a4a1e','#e02020','#ff8c1a','#ffe020','#2fae4a','#2060e0','#8a3ad0','#888','#fff'],T={5:'#d4af37',10:'#c0c0c0',1:'#7a4a1e',2:'#e02020'};$('#c0').value=1;$('#c1').value=0;$('#c2').value=2;
 const up=()=>{const a=+$('#c0').value,b=+$('#c1').value,m=+$('#c2').value;$('#bd0').setAttribute('fill',C[a]);$('#bd1').setAttribute('fill',C[b]);$('#bd2').setAttribute('fill',m<0?(m===-1?'#d4af37':'#c0c0c0'):C[m]);$('#bd3').setAttribute('fill',T[$('#c3').value]);
 $('#cval').textContent=fmt((a*10+b)*10**m,'Ω')+' ±'+$('#c3').value+'%'};['c0','c1','c2','c3'].forEach(i=>$('#'+i).onchange=up);up()}},

{id:'react',cat:'Tools',ic:'X',t:'Reactance Calculator',s:'Xc and XL vs frequency.',
 html:()=>`<div class="lab"><div class="box stage"><h3>Impedance vs frequency (log)</h3><canvas id="cv" style="height:280px"></canvas><small style="color:var(--mute)">Yellow: XL, rising. Red: Xc, falling.</small></div>
 <div class="box"><h3>Controls</h3>${sl('f','Frequency (log)',1,6,0.05,3,'10^x Hz')}${sl('c','C',1,1000,1,100,'nF')}${sl('l','L',1,1000,1,10,'mH')}${ro([['fr','f'],['xc','Xc'],['xl','XL'],['f0','Resonance f0']])}${chips(['reactance','capacitor','inductor'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> A capacitor blocks slow signals and passes fast ones; an inductor does the opposite. Where Xc = XL the circuit <b>resonates</b>: f0 = 1/(2π√LC). That is how radios tune to a station.</div>`,
 init(){bind(['f','c','l'],()=>{const f=10**val('f'),C=val('c')*1e-9,L=val('l')*1e-3,xc=x=>1/(2*Math.PI*10**x*C),xl=x=>2*Math.PI*10**x*L;
 $('#fr').textContent=fmt(f,'Hz');$('#xc').textContent=fmt(xc(val('f')),'Ω');$('#xl').textContent=fmt(xl(val('f')),'Ω');$('#f0').textContent=fmt(1/(2*Math.PI*Math.sqrt(L*C)),'Hz');
 const cv=$('#cv'),lg=v=>Math.max(0,Math.log10(v)+1);plot(cv,x=>lg(xl(x+1)),5,9,{label:'log10 |X|'});const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.strokeStyle='#e63b2e';c.lineWidth=4;c.beginPath();
 for(let p=0;p<=W;p++){const y=H-lg(xc(1+p/W*5))/9*H;p?c.lineTo(p,y):c.moveTo(p,y)}c.stroke();c.fillStyle='#1f5fbf';c.fillRect((val('f')-1)/5*W-2,0,4,H)})}},

{id:'sims',cat:'Library',ic:'⚙',t:'Online Simulators & Tools',s:'Curated external tools to go further.',links:true}
];

/* shared RC/RL module */
function rcHTML(sym,unit,key,reason){return `<div class="lab"><div class="box stage"><h3>Response curve</h3><canvas id="cv" style="height:220px"></canvas>
 ${loop(resV(220,40,'R').replace('y="5"','y="5"')+`<g data-info="${key}"><rect x="320" y="95" width="40" height="50" fill="var(--panel)" stroke="var(--blu)" stroke-width="3"/><text x="365" y="125" data-info="${key}">${sym}</text></g>`,'V').replace('viewBox="0 0 400 240"','viewBox="0 0 400 240" style="max-height:150px"')}</div>
 <div class="box"><h3>Controls</h3>${sl('r','R',1,100,1,10,'kΩ')}${sl('x',sym,1,1000,1,100,unit)}
 <div class="btnrow"><button id="go">▶ ${sym==='C'?'Charge':'Energize'}</button><button id="dis">◼ ${sym==='C'?'Discharge':'Release'}</button></div>${ro([['tau','τ'],['now','Level']])}${chips([key,'tau'])}</div></div>
 <div class="reason"><b>Easy reasoning:</b> ${reason}</div>`}
function rcInit(sym){let charging=true,start=performance.now(),from=0,level=0;
 const tau=()=>sym==='C'?val('r')*1e3*val('x')*1e-6:val('x')*1e-3/(val('r')*1e3);
 bind(['r','x'],()=>{$('#tau').textContent=fmt(tau(),'s')});
 const go=c=>{charging=c;from=level;start=performance.now()};$('#go').onclick=()=>go(true);$('#dis').onclick=()=>go(false);
 const loopf=now=>{const T=tau(),vis=T<.05?0.6:T*5,el=(now-start)/1000*(5*T/vis);const tgt=charging?1:0;
 level=tgt+(from-tgt)*Math.exp(-el/T);$('#now').textContent=(level*100).toFixed(1)+' %';setFlow(Math.abs(tgt-level)*.05);
 plot($('#cv'),x=>tgt+(from-tgt)*Math.exp(-x/T),5*T,1.05,{until:el,label:(sym==='C'?'Vc':'IL')+' / max, 5τ window'});rafId=requestAnimationFrame(loopf)};rafId=requestAnimationFrame(loopf)}

const LINKS=[['Falstad CircuitJS','[falstad.com](https://www.falstad.com/circuit/)','Animated in-browser circuit simulator, the best way to "see" current.'],
['Tinkercad Circuits','[tinkercad.com](https://www.tinkercad.com/circuits)','Breadboard and Arduino simulation for beginners.'],
['Wokwi','[wokwi.com](https://wokwi.com)','Simulate Arduino, ESP32 and Raspberry Pi Pico projects online.'],
['CircuitLab','[circuitlab.com](https://www.circuitlab.com)','Schematic editor with SPICE-style simulation.'],
['EveryCircuit','[everycircuit.com](https://everycircuit.com)','Interactive animated circuit simulation.'],
['EasyEDA','[easyeda.com](https://easyeda.com)','Schematic capture, simulation and PCB design.'],
['KiCad','[kicad.org](https://www.kicad.org)','Free, open-source professional PCB suite.'],
['Logisim Evolution','[github.com](https://github.com/logisim-evolution/logisim-evolution)','Digital logic design and simulation.'],
['DigiKey Calculators','[digikey.com](https://www.digikey.com/en/resources/online-conversion-calculators)','Dozens of engineering calculators.']];

/* ---------- ROUTER / UI ---------- */
const cats=[...new Set(TOPICS.map(t=>t.cat))],catCol={Fundamentals:'var(--red)',Passive:'var(--blu)',Semiconductors:'var(--yel)',Digital:'var(--grn)',Signals:'var(--blu)',Tools:'var(--yel)',Library:'var(--red)'};
let filter='All';
function buildNav(){$('#nav').innerHTML=`<a href="#home" data-id="home">⌂ Home grid</a>`+cats.map(c=>`<h4>${c}</h4>`+TOPICS.filter(t=>t.cat===c).map(t=>`<a href="#${t.id}" data-id="${t.id}"><span style="width:22px;text-align:center">${t.ic}</span>${t.t}</a>`).join('')).join('')}
function home(){$('#main').innerHTML=`<div class="hero"><div><h2>Electronics,<br><b>made visible.</b></h2><p>Interactive schematics, live simulations and online tools. Move the sliders, click the ⓘ chips and watch the current flow.</p></div>
 <div class="shapes"><i style="background:var(--red);border-radius:50%"></i><i style="background:var(--yel)"></i><i style="background:var(--blu);clip-path:polygon(50% 0,100% 100%,0 100%)"></i></div></div>
 <input id="search" type="text" placeholder="⌕  Search: capacitor, LED, 555, logic…"><div class="chips" id="cf">${['All',...cats].map(c=>`<button class="${c===filter?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="grid" id="grid"></div>`;
 const draw=()=>{const q=$('#search').value.toLowerCase();$('#grid').innerHTML=TOPICS.filter(t=>(filter==='All'||t.cat===filter)&&(t.t+t.s+t.cat).toLowerCase().includes(q)).map(t=>`<div class="card" onclick="location.hash='${t.id}'"><span class="tag" style="background:${catCol[t.cat]}">${t.cat}</span><div class="ic">${t.ic}</div><h3>${t.t}</h3><p>${t.s}</p></div>`).join('')||'<p>No match.</p>'};
 $('#search').oninput=draw;$('#cf').onclick=e=>{if(e.target.dataset.c){filter=e.target.dataset.c;home()}};draw()}
function topic(t){const i=TOPICS.indexOf(t),prev=TOPICS[(i-1+TOPICS.length)%TOPICS.length],next=TOPICS[(i+1)%TOPICS.length];
 const body=t.links?`<div class="links">${LINKS.map(([n,u,d])=>`<a href="${u}" target="_blank" rel="noopener"><div class="card"><span class="tag hazard" style="color:transparent">..</span><div class="ic">↗</div><h3>${n}</h3><p>${d}</p></div></a>`).join('')}</div>
 <div class="reason"><b>Easy reasoning:</b> Use this library to understand <i>why</i>, then rebuild the same circuit in Falstad or Tinkercad to experiment freely.</div>`:t.html();
 $('#main').innerHTML=`<div class="topbar"><button onclick="location.hash='${prev.id}'">◀ ${prev.t}</button><button onclick="location.hash='home'">▦ Grid</button><button onclick="location.hash='${next.id}'">${next.t} ▶</button></div>
 <div class="thead"><small>${t.cat} · ${i+1}/${TOPICS.length}</small><h2>${t.ic} ${t.t}</h2><p>${t.s} Click any <b>ⓘ</b> chip or underlined label to open an explanation window.</p></div>${body}`;
 if(t.init)t.init()}
function route(){clearSims();const id=location.hash.slice(1)||'home',t=TOPICS.find(x=>x.id===id);t?topic(t):home();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===(t?t.id:'home')));$('#nav').classList.remove('open');window.scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const i=TOPICS.findIndex(t=>t.id===location.hash.slice(1));if(i<0)return;
 if(e.key==='ArrowRight')location.hash=TOPICS[(i+1)%TOPICS.length].id;if(e.key==='ArrowLeft')location.hash=TOPICS[(i-1+TOPICS.length)%TOPICS.length].id});
$('#homeBtn').onclick=()=>location.hash='home';$('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');
const th=localStorage.getItem('vw-theme');if(th)document.documentElement.dataset.theme=th;
$('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('vw-theme',n);route()};

/* ---------- INTRO GEARS ---------- */
function gear(cx,cy,n,r,cls,col){const ro=r+5,ri=r-4,st=2*Math.PI/n;let d='';for(let i=0;i<n;i++){const a=i*st;[[ri,a],[ro,a+st*.15],[ro,a+st*.45],[ri,a+st*.6]].forEach(([R,A],k)=>d+=(i||k?'L':'M')+(cx+R*Math.cos(A)).toFixed(1)+' '+(cy+R*Math.sin(A)).toFixed(1))}
 return `<g class="gear ${cls}"><path d="${d}Z" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${r*.35}" fill="#0d0d0e"/><circle cx="${cx}" cy="${cy}" r="${r*.12}" fill="${col}"/></g>`}
$('#gears').innerHTML=gear(50,60,12,36,'g1','#e63b2e')+gear(110,60,8,24,'g2','#f2c230')+gear(148,98,10,30,'g3','#1f5fbf');
let p=0;const pi=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*6));$('#pct').textContent='LOADING CIRCUITS '+p+'%';if(p>=100)clearInterval(pi)},110);
setTimeout(()=>{$('#pct').textContent='SYSTEM READY ▣';setTimeout(()=>$('#intro').classList.add('hide'),400)},2800);
buildNav();route();
</script>
</body>
</html>
